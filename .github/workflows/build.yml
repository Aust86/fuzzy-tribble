name: Build DECtalk

on:
  workflow_dispatch:

jobs:
  inspect-and-build:
    runs-on: windows-2022

    steps:
      - name: Checkout DECtalk
        uses: actions/checkout@v4
        with:
          repository: dectalk/dectalk
          ref: develop

      - name: Inspect solution configurations
        shell: powershell
        run: |
          Write-Host "===== SOLUTION CONFIGURATIONS ====="
          Select-String -Path src\DECtalk.sln `
            -Pattern "SolutionConfigurationPlatforms|ProjectConfigurationPlatforms|Debug|Release|Win32|x64" `
            -Context 1,1

      - name: Inspect Visual Studio projects
        shell: powershell
        run: |
          Write-Host "===== PROJECT FILES ====="

          Get-ChildItem -Recurse -Include *.vcxproj,*.vcproj |
            ForEach-Object {
              Write-Host ""
              Write-Host "========================================"
              Write-Host $_.FullName
              Write-Host "========================================"

              Select-String -Path $_.FullName `
                -Pattern "PlatformToolset|PlatformTarget|ConfigurationType|Win32|x64"
            }

      - name: Initialize MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl
          msbuild -version

      - name: List solution projects
        shell: powershell
        run: |
          Write-Host "===== PROJECTS IN SOLUTION ====="
          Select-String -Path src\DECtalk.sln `
            -Pattern 'Project\('

      - name: Build default configuration
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd src

          msbuild DECtalk.sln ^
            /m ^
            /p:Configuration=Release ^
            /v:minimal

      - name: Find generated files
        if: always()
        shell: powershell
        run: |
          Write-Host "===== DLL FILES ====="
          Get-ChildItem -Recurse -Filter *.dll |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "===== LIB FILES ====="
          Get-ChildItem -Recurse -Filter *.lib |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "===== HEADER FILES ====="
          Get-ChildItem -Recurse -Include *.h,*.hpp |
            Select-Object FullName

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dectalk-build
          path: |
            **/*.dll
            **/*.lib
            **/*.h
            **/*.hpp
          if-no-files-found: warn
