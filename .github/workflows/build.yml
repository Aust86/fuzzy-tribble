name: Build DECtalk x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout DECtalk
        uses: actions/checkout@v4
        with:
          repository: dectalk/dectalk
          ref: develop

      - name: Build DECtalk x64
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          cd src

          msbuild DECtalk.sln ^
            /m ^
            /p:Configuration="Release - ENGLISH_US" ^
            /p:Platform=AMD64 ^
            /v:minimal

      - name: Find DLLs and headers
        shell: powershell
        run: |
          Write-Host "===== DLLs ====="
          Get-ChildItem -Recurse -Filter *.dll |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "===== LIBs ====="
          Get-ChildItem -Recurse -Filter *.lib |
            Select-Object FullName, Length

          Write-Host ""
          Write-Host "===== HEADERS ====="
          Get-ChildItem -Recurse -Include *.h,*.hpp |
            Select-Object FullName

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact

          Get-ChildItem -Recurse -Filter *.dll |
            Copy-Item -Destination artifact -Force

          Get-ChildItem -Recurse -Filter *.lib |
            Copy-Item -Destination artifact -Force

          Get-ChildItem -Recurse -Include *.h,*.hpp |
            Copy-Item -Destination artifact -Force

      - name: Upload DECtalk x64
        uses: actions/upload-artifact@v4
        with:
          name: dectalk-x64
          path: artifact
